name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0, 'src'); import pchealth; print(pchealth.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "標籤 ${{ github.ref_name }} 與程式版本 $v 不符" }

      - name: Get smartctl
        shell: pwsh
        run: |
          choco install smartmontools -y --no-progress
          $root = "C:\Program Files\smartmontools"
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item "$root\bin\smartctl.exe" bin\
          $license = Get-ChildItem $root -Recurse -Filter "COPYING*" | Select-Object -First 1
          if (-not $license) { throw "找不到 smartmontools 的 GPL 授權檔" }
          Copy-Item $license.FullName bin\COPYING.txt

      - name: Get LibreHardwareMonitorLib
        shell: pwsh
        env:
          LHM_VERSION: v0.9.6
          LHM_SHA256: 086d9f1b5a99e643edc2cfaaac16051685b551e4c5ac0b32a57c58c0e529c001
        run: |
          $zip = "lhm.zip"
          Invoke-WebRequest "https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/releases/download/$env:LHM_VERSION/LibreHardwareMonitor.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:LHM_SHA256) { throw "LibreHardwareMonitor.zip 的 SHA256 不符：$hash" }
          Expand-Archive $zip -DestinationPath lhm-full
          New-Item -ItemType Directory -Force bin\lhm | Out-Null
          # 只要函式庫與相依檔，不要 LHM 的介面程式
          Get-ChildItem lhm-full -Filter *.dll | Where-Object { $_.Name -notmatch '^(Aga\.Controls|OxyPlot|Microsoft\.Win32\.TaskScheduler)' } |
            Copy-Item -Destination bin\lhm
          if (-not (Test-Path bin\lhm\LibreHardwareMonitorLib.dll)) { throw "缺少 LibreHardwareMonitorLib.dll" }

      - name: Build exe
        shell: pwsh
        run: |
          ./build.ps1
          & dist/PCHealthCheck/_internal/bin/smartctl.exe --version | Select-Object -First 1
          if (-not (Test-Path dist/PCHealthCheck/_internal/bin/COPYING.txt)) { throw "授權檔沒有被打包" }
          if (-not (Test-Path dist/PCHealthCheck/_internal/bin/lhm/LibreHardwareMonitorLib.dll)) { throw "LHM 沒有被打包" }

      - name: Zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist/PCHealthCheck -DestinationPath "PCHealthCheck-${{ github.ref_name }}.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PCHealthCheck-${{ github.ref_name }}.zip
          generate_release_notes: true
